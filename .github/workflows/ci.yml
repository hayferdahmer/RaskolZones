name: RaskolZones CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: raskolzones-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate repository and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Java 25
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Validate project documentation
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s docs/ARCHITECTURE_DECISIONS.md
          python3 - <<'PY'
          from pathlib import Path

          decisions = Path("docs/ARCHITECTURE_DECISIONS.md").read_text(encoding="utf-8")
          technical = Path("docs/TECHNICAL_SPECIFICATION.md").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")

          required_decisions = [
              "## A-00. Базовая архитектура",
              "## A-18. Публичный API и интеграционные контракты",
              "## A-19. Безопасность административных операций",
              "## A-32. Критерии готовности, приёмки и первого стабильного релиза",
              "## A-33. Модульные границы, владение данными и трассируемость требований",
              "## A-34. Согласованность данных, конкурентный доступ и восстановление операций",
              "## A-35. Модель угроз и границы доверия",
              "## A-36. Документация и нормативные источники",
              "## A-37. Детерминированное разрешение территориальных правил",
              "## A-38. Точная семантика приоритетов",
              "## A-39. Актуальность контекста и атомарность применения правил",
              "## A-40. Защита квитанций решений от повторного и подменённого исполнения",
              "## A-41. Управление жизненным циклом криптографических ключей",
              "## A-42. Криптографический профиль и цепочка доверия",
              "## A-43. Переход от проектирования к реализации",
          ]
          required_a38 = [f"### A38.{number}." for number in range(1, 9)]
          required_a39 = [f"### A39.{number}." for number in range(1, 9)]
          required_a40 = [f"### A40.{number}." for number in range(1, 9)]
          required_a41 = [f"### A41.{number}." for number in range(1, 9)]
          required_a42 = [f"### A42.{number}." for number in range(1, 9)]
          missing_a42 = [heading for heading in required_a42 if heading not in decisions]
          if missing_a42:
              raise SystemExit("Canonical A-42 decision subsections missing: " + ", ".join(missing_a42))
          missing_a41 = [heading for heading in required_a41 if heading not in decisions]
          if missing_a41:
              raise SystemExit("Canonical A-41 decision subsections missing: " + ", ".join(missing_a41))
          missing_a40 = [heading for heading in required_a40 if heading not in decisions]
          if missing_a40:
              raise SystemExit("Canonical A-40 decision subsections missing: " + ", ".join(missing_a40))
          missing_a39 = [heading for heading in required_a39 if heading not in decisions]
          if missing_a39:
              raise SystemExit("Canonical A-39 decision subsections missing: " + ", ".join(missing_a39))
          missing_a38 = [heading for heading in required_a38 if heading not in decisions]
          if missing_a38:
              raise SystemExit("Canonical A-38 decision subsections missing: " + ", ".join(missing_a38))

          missing = [heading for heading in required_decisions if heading not in decisions]
          if missing:
              raise SystemExit("Missing canonical decision sections: " + ", ".join(missing))

          required_technical = [
              "Канонический журнал архитектурных решений содержит A-00–A-43",
              "## 18. Нормативность и согласованность документации",
              "## 19. Краткая история решений",
              "A-35 — формальная модель угроз",
              "A-36 — канонический журнал решений",
              "A-37 — единая детерминированная матрица приоритетов",
              "A-38 — фиксированный глобальный порядок критериев",
              "A-39 — версионная актуальность решений",
              "A-40 — одноразовые криптографически защищённые квитанции",
              "A-41 — ротация ключей с периодом перекрытия",
              "A-42 — профиль Ed25519 с криптографической гибкостью",
              "A-43 — переход к Maven-разработке модульного монолита",
          ]
          required_a38_technical = [
              "### A-38. Точная семантика приоритетов",
              "обязательная безопасность → иерархия территории → числовой вес → специфичность правила",
              "A-38 — фиксированный глобальный порядок критериев",
          ]
          required_a39_technical = [
              "### A-39. Актуальность контекста и атомарность применения правил",
              "version_bound",
              "decision receipt",
              "A-39 — версионная актуальность решений",
          ]
          required_a43 = [f"### A43.{number}." for number in range(1, 8)]
          missing_a43 = [heading for heading in required_a43 if heading not in decisions]
          if missing_a43:
              raise SystemExit("Canonical A-43 decision subsections missing: " + ", ".join(missing_a43))

          required_a43_technical = [
              "### A-43. Старт реализации и инженерный процесс",
              "Maven", "Java 25", "Paper 26.2", "foundation", "модульный монолит", "Paper runtime/smoke tests",
          ]
          missing_a43_technical = [item for item in required_a43_technical if item not in technical]
          if missing_a43_technical:
              raise SystemExit("Technical specification is missing A-43 requirements: " + ", ".join(missing_a43_technical))

          required_a42_technical = [
              "### A-42. Криптографический профиль и цепочка доверия",
              "Ed25519",
              "offline-pinned",
              "signed_monotonic",
              "canonical_versioned",
              "jca_selftest",
          ]
          missing_a42_technical = [item for item in required_a42_technical if item not in technical]
          if missing_a42_technical:
              raise SystemExit("Technical specification is missing A-42 requirements: " + ", ".join(missing_a42_technical))

          required_a41_technical = [
              "### A-41. Управление жизненным циклом криптографических ключей",
              "verify-only",
              "revoke_fail_closed",
              "Key ID",
              "fail-closed",
          ]
          missing_a41_technical = [item for item in required_a41_technical if item not in technical]
          if missing_a41_technical:
              raise SystemExit("Technical specification is missing A-41 requirements: " + ", ".join(missing_a41_technical))

          required_a40_technical = [
              "### A-40. Защита квитанций решений от повторного и подменённого исполнения",
              "одноразовая",
              "долговременным реестром операций",
              "A-40 — одноразовые криптографически защищённые квитанции",
          ]
          missing_a40_technical = [item for item in required_a40_technical if item not in technical]
          if missing_a40_technical:
              raise SystemExit("Technical specification is missing A-40 requirements: " + ", ".join(missing_a40_technical))

          missing_a39_technical = [item for item in required_a39_technical if item not in technical]
          if missing_a39_technical:
              raise SystemExit("Technical specification is missing A-39 requirements: " + ", ".join(missing_a39_technical))

          missing_a38_technical = [item for item in required_a38_technical if item not in technical]
          if missing_a38_technical:
              raise SystemExit("Technical specification is missing A-38 requirements: " + ", ".join(missing_a38_technical))

          missing = [item for item in required_technical if item not in technical]
          if missing:
              raise SystemExit("Technical specification is out of sync: " + ", ".join(missing))

          required_readme = [
              "docs/ARCHITECTURE_DECISIONS.md",
              "docs/TECHNICAL_SPECIFICATION.md",
              "docs/ROADMAP.md",
              "Paper 26.2",
              "Java 25",
              "Статус: разработка — foundation, Territory Core, Spatial Query Engine, Territory Transition Engine, Rule Resolution Engine, Rule Registry / Evaluation Pipeline, Rule Profiles / Inheritance Engine и Contextual Rule Engine",
          ]
          missing = [item for item in required_readme if item not in readme]
          if missing:
              raise SystemExit("README is incomplete: " + ", ".join(missing))

          checked = [
              Path("README.md"),
              Path("docs/ARCHITECTURE_DECISIONS.md"),
              Path("docs/TECHNICAL_SPECIFICATION.md"),
              Path("docs/ROADMAP.md"),
              Path("docs/CI_AND_AUTOMATION.md"),
          ]
          for path in checked:
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if line.rstrip(" \t") != line and not line.endswith("  "):
                      raise SystemExit(f"{path}:{number}: trailing whitespace")
          print("Canonical decisions, technical specification, README and whitespace checks passed.")
          PY

      - name: Build with Maven
        if: hashFiles('pom.xml') != ''
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Inspect packaged plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          jars = sorted(Path("target").glob("raskol-zones-*.jar"))
          if len(jars) != 1:
              raise SystemExit(f"Expected exactly one plugin JAR, found: {jars}")

          jar = jars[0]
          with ZipFile(jar) as archive:
              names = set(archive.namelist())
              required = {
                  "plugin.yml",
                  "ru/raskol/zones/RaskolZonesPlugin.class",
                  "ru/raskol/zones/foundation/FoundationRuntime.class",
                  "ru/raskol/zones/foundation/config/ConfigurationService.class",
                  "ru/raskol/zones/foundation/health/HealthService.class",
                  "ru/raskol/zones/world/WorldRegistryService.class",
                  "ru/raskol/zones/world/WorldLifecycleListener.class",
                  "ru/raskol/zones/territory/TerritoryService.class",
                  "ru/raskol/zones/territory/SqliteTerritoryRepository.class",
                  "ru/raskol/zones/territory/geometry/CuboidGeometry.class",
                  "ru/raskol/zones/territory/geometry/PolygonGeometry.class",
                  "ru/raskol/zones/territory/type/TerritoryTypeRegistry.class",
                  "ru/raskol/zones/territory/spatial/SpatialQueryService.class",
                  "ru/raskol/zones/territory/spatial/WorldSpatialIndex.class",
                  "ru/raskol/zones/territory/spatial/SpatialQueryResult.class",
                  "ru/raskol/zones/territory/transition/TerritoryTransitionEngine.class",
                  "ru/raskol/zones/territory/transition/TerritoryTransitionListener.class",
                  "ru/raskol/zones/territory/transition/event/TerritoryTransitionEvent.class",
                "ru/raskol/zones/territory/rules/TerritoryRuleRegistry.class",
                "ru/raskol/zones/territory/rules/SqliteTerritoryRuleRepository.class",
                "ru/raskol/zones/territory/rules/TerritoryRuleEvaluationPipeline.class",
                  "ru/raskol/zones/territory/rules/TerritoryRuleResolutionEngine.class",
                  "ru/raskol/zones/territory/rules/TerritoryRuleProfileRegistry.class",
                  "ru/raskol/zones/territory/rules/SqliteTerritoryRuleProfileRepository.class",
                  "ru/raskol/zones/territory/rules/RuleEvaluationContext.class",
                  "ru/raskol/zones/territory/rules/RuleConditionEvaluator.class",
                  "ru/raskol/zones/territory/rules/RuleConditionCodec.class",
                  "ru/raskol/zones/territory/rules/RuleResolutionResult.class",
                  "ru/raskol/zones/territory/rules/SourceAuthorityRegistry.class",
                  "org/sqlite/JDBC.class",
              }
              missing = sorted(required - names)
              if missing:
                  raise SystemExit("JAR is missing required entries: " + ", ".join(missing))

              descriptor = archive.read("plugin.yml").decode("utf-8")
              required_metadata = [
                  "main: ru.raskol.zones.RaskolZonesPlugin",
                  "api-version: '26.2'",
              ]
              missing_metadata = [item for item in required_metadata if item not in descriptor]
              if missing_metadata:
                  raise SystemExit("plugin.yml metadata mismatch: " + ", ".join(missing_metadata))
              if "${project.version}" in descriptor:
                  raise SystemExit("plugin.yml contains an unresolved Maven version placeholder")

          print(f"Packaged plugin verified: {jar} ({jar.stat().st_size} bytes)")
          PY

      - name: Paper 26.2 runtime smoke test
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p .paper-smoke/plugins
          cp target/raskol-zones-*.jar .paper-smoke/plugins/RaskolZones.jar
          printf 'eula=true\n' > .paper-smoke/eula.txt
          cat > .paper-smoke/server.properties <<'PROPERTIES'
          server-port=25575
          online-mode=false
          spawn-protection=0
          max-players=1
          level-name=smoke-world
          PROPERTIES

          python3 - <<'PY'
          import json
          import urllib.request

          import hashlib
          import json
          import urllib.request

          base = "https://fill.papermc.io/v3/projects/paper/versions/26.2"
          headers = {
              "User-Agent": "RaskolZones-CI/1.0 (https://github.com/hayferdahmer/RaskolZones)",
              "Accept": "application/json",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          builds = get_json(base + "/builds")
          selected = next((item for item in builds if item.get("channel") == "STABLE"), None)
          if selected is None:
              raise SystemExit("Paper 26.2 has no stable build available")

          build = selected["id"]
          download = selected["downloads"]["server:default"]
          filename = download["name"]
          request = urllib.request.Request(download["url"], headers={"User-Agent": headers["User-Agent"]})
          digest = hashlib.sha256()
          with urllib.request.urlopen(request, timeout=90) as response, open(".paper-smoke/paper.jar", "wb") as output:
              while chunk := response.read(1024 * 1024):
                  digest.update(chunk)
                  output.write(chunk)

          expected = download["checksums"]["sha256"]
          actual = digest.hexdigest()
          if actual.lower() != expected.lower():
              raise SystemExit(f"Paper SHA-256 mismatch: expected {expected}, got {actual}")
          print(f"Downloaded and verified Paper 26.2 build {build}: {filename}")
          PY

          cd .paper-smoke
          java -Xms512M -Xmx1G -jar paper.jar --nogui > server.log 2>&1 &
          server_pid=$!
          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM "$server_pid" 2>/dev/null || true
              for attempt in $(seq 1 20); do
                if ! kill -0 "$server_pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              if kill -0 "$server_pid" 2>/dev/null; then
                kill -KILL "$server_pid" 2>/dev/null || true
              fi
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          started=false
          for attempt in $(seq 1 180); do
            if grep -Fq "Done (" server.log; then
              started=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              echo "Paper server exited before startup completed"
              exit 1
            fi
            sleep 1
          done

          if [ "$started" != true ]; then
            cat server.log
            echo "Paper server startup timed out"
            exit 1
          fi

          grep -F "Enabling RaskolZones v" server.log
          ready=false
          for attempt in $(seq 1 30); do
            if grep -Fq "RaskolZones готов. Состояние: READY" server.log; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              echo "Paper server exited before RaskolZones became ready"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            cat server.log
            echo "RaskolZones did not become ready within 30 seconds"
            exit 1
          fi

          grep -F "Пространственные индексы готовы для миров:" server.log
          grep -F "RaskolZones готов. Состояние: READY" server.log
          test -s plugins/RaskolZones/config.yml
          test -s plugins/RaskolZones/raskolzones.db
          python3 - <<'PY'
          import sqlite3
          import time

          database = "plugins/RaskolZones/raskolzones.db"
          deadline = time.monotonic() + 15
          while True:
              with sqlite3.connect(database, timeout=5) as connection:
                  version = connection.execute("PRAGMA user_version").fetchone()[0]
                  tables = {
                      row[0] for row in connection.execute(
                          "SELECT name FROM sqlite_master WHERE type = 'table'"
                      )
                  }
                  count = connection.execute(
                      "SELECT COUNT(*) FROM world_registry"
                  ).fetchone()[0] if "world_registry" in tables else 0
              territory_tables = {"territories", "territory_geometry", "territory_vertices"}
              rule_tables = {"territory_rules"}
              profile_tables = {"territory_rule_profiles"}
              if version == 6 and "world_registry" in tables and territory_tables.issubset(tables) and rule_tables.issubset(tables) and profile_tables.issubset(tables) and count > 0:
                  print(f"Territory schema verified: schema={version}, tables={sorted(territory_tables)}")
                  print(f"Rule registry schema verified: tables={sorted(rule_tables)}")
                  print(f"Rule profile schema verified: tables={sorted(profile_tables)}")
                  columns = {
                      row[1] for row in connection.execute("PRAGMA table_info(territory_rules)")
                  }
                  profile_columns = {
                      row[1] for row in connection.execute("PRAGMA table_info(territory_rule_profiles)")
                  }
                  if "conditions" not in columns or "conditions" not in profile_columns:
                      raise SystemExit("Contextual rule condition columns are missing")
                  print("Contextual rule condition storage verified: schema=6")
                  print(f"World registry verified: schema={version}, loaded worlds={count}")
                  break
              if time.monotonic() >= deadline:
                  raise SystemExit(
                      f"World registry not initialized: schema={version}, "
                      f"tables={sorted(tables)}, records={count}"
                  )
              time.sleep(0.5)
          PY
          echo "Paper 26.2 runtime smoke test passed."

      - name: Require Maven build descriptor
        run: test -s pom.xml
